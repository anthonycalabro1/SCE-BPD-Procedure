Objective: Create structured first draft with clear flags for SCE validation, and identify relevant solution requirements from SCE's ~3000 requirement library

Activities:

Draft Section 1.1 - Project Background (1 hour):

Pull AMI 2.0 program overview from ConOps

Summarize business drivers (aging infrastructure, regulatory requirements, customer experience)

Describe how this L3 process fits into overall AMI 2.0 program

Source: ConOps, AMI 1.0 lessons learned, program charter

Mostly reusable across all BRDs with minor L3-specific tweaks

Extract Capabilities from Repository (1.5 hours with AI): Run AI prompt (see Appendix A.2.2: Capabilities Extraction from Repository) Process:

Input: Requirements from 3 similar AMI processes from other utilities

AI extracts and synthesizes 10-15 capabilities

Format: "Ability to [verb] [object]"

Flag uncertain items with "[VALIDATE WITH SCE]"

Review AI output for relevance and alignment with process objective

Solution Requirements Mapping (2 hours - Offshore with AI):

CRITICAL NEW ACTIVITY: Identify which of SCE's ~3000 solution requirements are relevant to this L3 process

Context: SCE has developed comprehensive solution requirements organized by:

System-based (~2000): MDMS, HES, DI Hub, Analytics Application

Within each system: Organized by capability area (e.g., MDMS meter reading requirements)

Functional (~1000): Software Baseline, Managed Cloud, Service Requirements, Cyber

Objective: Filter the ~3000 to identify the ~20-50 solution requirements that directly or indirectly support this specific L3 process

Step 3.1: Identify Relevant Systems & Capability Areas (30 min - Onshore quick review)

Based on As-Is flow from Stage 1, identify which systems are involved

Example: "Off-Cycle Billing" process involves CSS, MDMS, HES

Identify which capability areas are relevant

Example: MDMS meter reading, MDMS VEE, HES on-demand reads

Pull the relevant sections from SCE's solution requirements Excel files

Example: Extract MDMS meter reading requirements section, HES on-demand reads section

Step 3.2: AI-Assisted Filtering (1.5 hours - Offshore)

Run AI filtering prompt (see Appendix A.2.1: Solution Requirements Filtering)

Process:

Input: L3 process details, systems involved, key process steps

Input: Relevant Excel sections from SCE's solution requirements library

AI classifies each requirement: Directly Relevant, Indirectly Relevant, or Not Relevant

Output: Excel table with classification and rationale

Step 3.3: Human Review & Validation (30 min - Onshore)

Review AI's classification

Validate DIRECTLY RELEVANT selections (these will be traced to business requirements)

Spot-check NOT RELEVANT exclusions (ensure we didn't miss anything)

Create initial groupings by process step or capability theme

Output: Filtered list of 20-50 relevant solution requirements ready for Stage 3

Why This Matters:

Ensures business requirements in Stage 3 align with approved solution requirements

Identifies which solution requirements the SI will use to build this process

Enables traceability (business requirement → solution requirement)

Highlights any gaps where business needs exist but solution requirements don't

Draft Success Criteria from Industry Benchmarks (1 hour with AI): Run AI prompt (see Appendix A.2.2: Capabilities Extraction from Repository) Process:

Input: Capabilities from step 2, industry best practices

AI generates 8-12 success criteria with measurable thresholds

Flags criteria requiring SCE-specific KPIs with [SCE TO DEFINE TARGET]

Review for completeness and ensure criteria would prove process is working

L3 process definition

Repository examples

Create empty tables:

Create placeholder for each, flagged for SCE to provide actual titles

Partial Section 1 draft (~6 pages)

Capabilities list (10-15 items, some flagged for validation)

As-Is flow from Stage 1

Questions list

Empty templates for users/devices/stakeholders

Create Session Discussion Guide (0.5 hours):

Agenda with time allocations

Specific questions organized by topic

Space for note capture

Show example BRD (the one you uploaded) - especially user/device tables

Org chart for this process area

Objective: Create and validate the To-Be process flow BEFORE generating requirements

CRITICAL DESIGN PRINCIPLE: The To-Be flow is the foundation for user journeys and business requirements. Generating requirements from an unvalidated To-Be flow leads to massive rework when the flow changes after workshop. This stage validates the To-Be flow first, creating a stable foundation for requirements generation in Stage 8.

Why This Two-Phase Approach:

User journeys map to specific process steps → if steps change, journeys must be rewritten

Business requirements support specific workflows → if workflow changes, requirements must be rewritten

Validating flow early prevents cascading rework downstream

Focused workshop on process only is more productive than trying to validate process AND requirements simultaneously

Instructions

User journeys capture the human experience of the To-Be process. Each journey maps a specific scenario to a specific user type and documents what that person thinks, does, and what needs to change. These are written from the user's perspective, not the system's perspective.

Prerequisites:

•  Validated To-Be flow from Stage 7 (the process steps the user will follow)

•  Section 1.3.5 user types with actual SCE job titles and characteristics (from Stage 3)

•  As-Is pain points from Stage 1 interviews (what frustrates users today) WHICH ARE BEING ADDRESSED IN THE TO-BE FLOW (Note: not all pain points identified in Stage 1 will be addressed)

Step 1: Identify 3-5 key scenarios from the validated To-Be flow. A scenario is a specific situation where a user type interacts with the process. Focus on: the primary happy-path scenario, 1-2 exception/edge-case scenarios, and any scenario that represents a major change from As-Is.

Step 2: For each scenario, map it to a specific user type from Section 1.3.5.

Step 3: Run the AI prompt below to generate draft user journeys.

Step 4 (Onshore QA): Review AI output to verify that user types match Section 1.3.5 exactly (actual SCE job titles, not generic roles), that user actions align with the validated To-Be steps, that "What to Change" items reflect actual improvements from the As-Is process, and that thoughts/feelings are realistic and grounded in interview insights from Stage 1.

Quality Criteria

•  Each journey references a real SCE user type from Section 1.3.5 (exact title)

•  "What to Change" items are traceable to As-Is pain points

•  "Why We Need This Change" connects to business drivers or success criteria from Section 1.2

•  Thoughts/feelings are realistic (not aspirational marketing language)

Instructions

This section describes the operational environment where the To-Be process will run. It covers both the physical environment (where users work, what hardware they use) and the system environment (how the solution integrates with existing SCE systems). Most of this content comes directly from Section 1.3.5 user/device tables and the solution architecture from ConOps.

Paragraph 1 - Physical User Environment: Describe where users work (office, field, hybrid, remote), what hardware they use (desktops, laptops, ruggedized tablets, mobile devices), network connectivity (on-premises LAN, VPN, cellular), and shift patterns (business hours, 24/7, on-call). Source this directly from Section 1.3.5 user characteristics.

Template Instruction: "Describe the assumptions and conditions upon which the requirements depend. Describe the transition and future state that's expected to be present when the solution is deployed."

Instructions

Assumptions are things the team believes to be true for the purposes of designing this process, but that have not been formally confirmed. Dependencies are external conditions or deliverables that must be in place for this process to work as designed. Both are critical for managing risk: if an assumption proves false or a dependency is not met, the To-Be process design may need to change.

Prerequisites:

•  Validated To-Be flow from Stage 7 - the process design that assumptions support

•  Filtered solution requirements from Stage 2 - system capabilities assumed

•  As applicable, ConOps and program timeline - deployment sequencing and release planning

•  Workshop notes from Stage 6 - any assumptions discussed or flagged

Step 1: Identify assumptions that underpin the To-Be design. Good assumptions answer: "What must be true for this To-Be process to work as designed?" Common sources include: system capabilities assumed from solution requirements, organizational readiness (training, staffing, change management), data quality and availability, integration partner readiness (SI, MIV vendors), and regulatory/policy stability.

Step 2: Identify dependencies by reviewing the process connections table and ConOps. Dependencies answer: "What external deliverables or conditions must be in place?" Common sources include: upstream L3 processes that feed into this one, system deployments or releases that must be completed first, data migrations or conversions that must be done, training or organizational changes required, and third-party vendor readiness.

Step 3: Run the AI prompt below to generate structured assumptions and dependencies.

Step 4 (Onshore QA): Review for completeness, accuracy, and risk relevance. Every assumption should be something that, if false, would require process redesign. Every dependency should be something that, if missing, would block this process from operating.

Quality Criteria

•  Minimum 8 assumptions and 5 dependencies per L3 process

•  Each assumption states what is believed to be true AND the consequence if it is not true

•  Each dependency identifies the external deliverable AND which process step it supports

•  Dependencies reference specific upstream L3 processes by name (from the process hierarchy)

•  AMI 1.0/2.0 coexistence assumptions are explicitly documented

•  No assumption contradicts a validated solution requirement
